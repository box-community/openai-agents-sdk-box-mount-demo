[project]
name = "box-sandbox-cli"
version = "0.1.0"
description = "Interactive CLI for a Docker-backed OpenAI SandboxAgent with a Box mount."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai-agents[docker]",
    "PyJWT[crypto]>=2.8.0",
    "prompt_toolkit>=3.0.47",
    "python-dotenv>=1.0.1",
]

[project.scripts]
box-sandbox-cli = "box_sandbox_cli.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
